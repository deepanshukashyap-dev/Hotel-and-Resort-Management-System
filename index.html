<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hotel and Resort Management System - Luxury hotel rooms, suites, spa, and vacation booking experience.">
  <title>Hotel &amp; Spa Adina | Luxury Hotel and Resort</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Main Project Stylesheet (Pure CSS) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ========================================================================
       HEADER / NAVIGATION
       ======================================================================== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="header-logo" aria-label="Hotel &amp; Spa Adina Home">
        <img src="assets/img/logo-white.svg" alt="Hotel &amp; Spa Adina Logo">
      </a>
      <nav class="main-nav" aria-label="Main Navigation">
        <a href="index.html" class="nav-link-custom active">Home</a>
        <a href="#rooms" class="nav-link-custom">Rooms</a>
        <a href="#restaurant" class="nav-link-custom">Restaurant</a>
        <a href="#spa" class="nav-link-custom">Spa</a>
        <a href="#contact" class="nav-link-custom">Contact</a>
      </nav>
    </div>
  </header>

  <!-- ========================================================================
       HERO SECTION
       ======================================================================== -->
  <section class="hero-section" id="home">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="hero-subtitle">Just Enjoy &amp; Relax</p>
      <h1 class="hero-title">Your Luxury Hotel For Vacation</h1>
      <a href="#rooms" class="btn-custom btn-custom-lg btn-accent">See our rooms</a>
    </div>
  </section>

  <!-- ========================================================================
       FOOTER
       ======================================================================== -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-content">
        <a href="index.html" class="footer-logo" aria-label="Hotel Adina Home">
          <img src="assets/img/logo-white.svg" alt="Hotel &amp; Spa Adina Logo">
        </a>
        <div class="footer-copyright">
          <p>&copy; 2026 Hotel &amp; Spa Adina. All Rights Reserved.</p>
        </div>
      </div>
    </div>
  </footer>

</html>
